name: Build Chinese Translation

on:
  push:
    branches:
      - master
    paths:
      - 'zh-cn/**'
      - 'programs/**'
      - 'img/**'
      - '.github/workflows/build-zh-cn.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HonKit
        run: npm install honkit

      - name: Prepare build directory
        run: |
          mkdir -p zh-build
          cp zh-cn/*.md zh-build/
          cp zh-cn/book.json zh-build/
          cp -r programs zh-build/
          cp -r img zh-build/

      - name: Build
        run: npx honkit build ./zh-build ./public

      - name: Deploy to GitHub Pages
        if: success()
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages-zh
          build_dir: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

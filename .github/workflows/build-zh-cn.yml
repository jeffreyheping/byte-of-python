name: Build Chinese Translation

on:
  push:
    branches:
      - master
    paths:
      - 'zh-cn/**'
      - 'programs/**'
      - 'img/**'
      - '.github/workflows/build-zh-cn.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Calibre + CJK Fonts
        run: |
          sudo apt update
          sudo apt install -y calibre fonts-noto-cjk

      - name: Prepare build directory
        run: |
          mkdir -p zh-build
          cp zh-cn/*.md zh-build/
          cp zh-cn/book.json zh-build/
          cp -r programs zh-build/
          cp -r img zh-build/

      - name: Install HonKit
        run: |
          cd zh-build
          npm install honkit --save-dev

      - name: Build HTML
        run: |
          cd zh-build
          npx honkit build . ../public

      - name: Build EPUB (Calibre)
        run: |
          cd zh-build
          npx honkit epub . ../python-jianming-jiaocheng.epub

      - name: Build PDF (Puppeteer + CJK Font)
        run: |
          cd public
          npm init -y > /dev/null 2>&1
          npm install puppeteer --save-dev 2>&1 | tail -3
          node -e "
const puppeteer = require('puppeteer');
(async () => {
  const browser = await puppeteer.launch({ headless: true, args: ['--no-sandbox'] });
  const page = await browser.newPage();
  await page.goto('file://' + process.cwd() + '/index.html', { waitUntil: 'networkidle0' });
  await page.pdf({
    path: '../python-jianming-jiaocheng.pdf',
    format: 'A4',
    printBackground: true,
    margin: { top: '20mm', bottom: '20mm', left: '15mm', right: '15mm' }
  });
  await browser.close();
  console.log('PDF generated successfully');
})();
          "

      - name: Deploy to GitHub Pages
        if: success()
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages-zh
          build_dir: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tag name
        id: tag
        run: echo "TAG_NAME=v1.0.zh-cn.$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: Python简明教程 ${{ steps.tag.outputs.TAG_NAME }}
          body: |
            《A Byte of Python》简体中文翻译版
            
            - PDF: python-jianming-jiaocheng.pdf
            - EPUB: python-jianming-jiaocheng.epub
          files: |
            python-jianming-jiaocheng.pdf
            python-jianming-jiaocheng.epub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
